[pytest]
# --assert=plain and no cache: the tests write nothing into the tree (the board records a check only from a clean tree).
# --capture=sys: a hang's faulthandler dump goes to fd 2, which fd capture redirects and loses when the dump exits the process.
addopts = -p no:cacheprovider --assert=plain --import-mode=importlib --capture=sys
markers =
    core: what the switch's build checks: skills, definitions, generators, rendered sizes
    hooks: hooks, setup installer, session registry
    board: the board against a fake bd
    contract: console contract, model tables
    prepass: pre-pass and default records
    engine: the protocol engine, one test per part
